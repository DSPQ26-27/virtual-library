services:
  db:
    image: postgres:17
    container_name: biblioteca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: biblioteca_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca_user -d biblioteca_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  biblioteca_pgdata:
